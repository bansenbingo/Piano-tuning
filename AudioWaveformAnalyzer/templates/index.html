<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音频波形 · 正弦波分解</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d8f249' stroke='%231a1f2c'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('plotly_js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>音频波形 · 正弦波分解</h1>
          <p>上传 WAV/M4A，自动转为 WAV 后降噪、拆分正弦波并写出函数解析式</p>
        </div>
      </div>
      <span class="version">v2.4</span>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <h2>分析设置</h2>

        <div class="field">
          <label for="file-input">上传 WAV 或 M4A 文件</label>
          <input type="file" id="file-input" accept=".wav,.m4a,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a" required>
          <p id="file-help" class="field-help">支持 WAV / M4A · M4A 会自动转换为 WAV</p>
        </div>

        <fieldset class="filter-group">
          <legend>降噪滤波</legend>
          <label class="toggle">
            <input type="checkbox" id="denoise" checked>
            <span>启用降噪（钢琴单音）</span>
          </label>
          <div class="filter-cuts">
            <div class="field">
              <label for="lowcut">低频截止 (Hz)</label>
              <input type="number" id="lowcut" value="20" min="1" step="1">
            </div>
            <div class="field">
              <label for="highcut">高频截止 (Hz)</label>
              <input type="number" id="highcut" value="12000" min="1" step="1">
            </div>
          </div>
        </fieldset>

        <div class="field">
          <div class="field-head">
            <label for="num-components">正弦波数量</label>
            <output id="num-value" for="num-components">5</output>
          </div>
          <input type="range" id="num-components" min="1" max="50" value="5" step="1">
        </div>

        <button id="analyze-btn" class="primary">开始分析</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </aside>

      <section class="content">
        <section id="empty-state" class="panel empty">
          <h2>等待分析</h2>
          <p>上传一个 WAV 或 M4A 文件；M4A 会自动转换为 WAV 后进入相同分析流程。</p>
        </section>

        <section id="results" class="results" hidden>
          <section class="panel meta">
            <div class="meta-head">
              <h2 id="meta-title">分析结果</h2>
              <div class="chips" id="meta-chips"></div>
            </div>
            <div class="expression">
              <div class="expression-label">拟合函数解析式</div>
              <code id="expression"></code>
            </div>
            <details class="components-list">
              <summary>查看各正弦波分量</summary>
              <ul id="component-list"></ul>
            </details>
          </section>

          <section class="panel plot-panel" id="denoise-panel" hidden>
            <div id="denoise-plot" class="plot"></div>
          </section>
          <section class="panel plot-panel">
            <div id="wave-plot" class="plot"></div>
          </section>
          <section class="panel plot-panel">
            <div id="spectrum-plot" class="plot"></div>
          </section>
          <section class="panel plot-panel">
            <div id="components-plot" class="plot"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
